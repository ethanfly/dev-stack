<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="DevStack">
  <defs>
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ds-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="ds-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ds-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#ds-bg)"/>
  <!-- three stacked slabs: a software stack, not a language mark -->
  <g transform="translate(64 70)">
    <ellipse cx="0" cy="18" rx="38" ry="12" fill="url(#ds-c)"/>
    <ellipse cx="0" cy="2" rx="38" ry="12" fill="url(#ds-b)"/>
    <ellipse cx="0" cy="-14" rx="38" ry="12" fill="url(#ds-a)"/>
    <circle cx="-16" cy="-14" r="3.2" fill="#ecfeff"/>
    <circle cx="8" cy="2" r="3.2" fill="#ccfbf1"/>
    <circle cx="-4" cy="18" r="3.2" fill="#99f6e4"/>
    <path d="M-16 -14 L8 2 L-4 18" fill="none" stroke="#ecfeff" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
